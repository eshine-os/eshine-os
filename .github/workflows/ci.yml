#
# Fixture-based CI. Gates run independently (a fresh QEMU per gate, or a
# scenario fixture for stateful families), so one red gate cannot block
# the rest. `static` runs the checkout-only checks; `artifacts` builds
# (and caches) the external Linux/busybox artifacts once per generation;
# `green` runs every active non-heavy gate in three shards inside the
# pinned toolchain image; `container` re-runs the boot smoke with no
# network. Yocto/image gates are local/release only.
#
# Runner pin: ubuntu-24.04. The QEMU shipped by ubuntu-latest
# (26.04 at the time of writing, qemu-system-arm 10.2.1) takes an EL2
# alignment fault during RTOS boot (runs 43535269610..43854057149:
# ESR_EL2=0x96000061 DFSC=alignment fault, no `eshine>` prompt).
# 24.04 ships QEMU 8.2.2, the version the gates were developed against.
name: ci
on:
  push:
    branches: [master, 'dev/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  static:
    # The boot tier lives in `container` (same script, pinned image,
    # no network) and green gates 1-18 cover it again; a host-side
    # smoke job would be a third copy plus an apt-get that repeatedly
    # stalled 7-15 min on hosted runners (runs 44225068223/
    # 44226378906/44262298722).  This job only runs the checks that
    # need nothing but the checkout.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: trailer validation
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag push: no new commit range to validate"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$base" ] || \
             [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          python3 scripts/check-commit-msg.py --range "$base..HEAD"
      - name: host independence
        run: scripts/check-host-independence.sh

  artifacts:
    # Guest artifacts (Linux Image, 8MiB initramfs, musl busybox) are
    # built once per cache generation and shared with every green shard.
    # The key is pinned to the artifact versions, not to build-script
    # mtimes: a script edit must not trigger a 17-minute cold rebuild
    # (runs 44093367769/44093324790 spent ~1000 s in prepare for that).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: restore guest artifact cache
        id: work-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .work
            tools/ramfs/bin/busybox
          key: eshine-work-${{ runner.os }}-${{ hashFiles('tools/artifacts.json', '3rd/manifest.yaml') }}
          restore-keys: eshine-work-${{ runner.os }}-
      - name: build toolchain image
        if: steps.work-cache.outputs.cache-hit != 'true'
        run: docker build -t eshine-build:ci -f docker/Dockerfile.build .
      - name: build guest artifacts (cold cache only)
        if: steps.work-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/workdir/home" "$RUNNER_TEMP/workdir/tmp"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" -v "$RUNNER_TEMP/workdir:/workdir" \
            -e ESHINE_WORK="$PWD/.work" -e HOME=/workdir/home \
            -e TMPDIR=/workdir/tmp \
            -w "$PWD" eshine-build:ci \
            bash scripts/ci-gates.sh prepare
      - name: save guest artifact cache
        if: steps.work-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .work
            tools/ramfs/bin/busybox
          key: eshine-work-${{ runner.os }}-${{ hashFiles('tools/artifacts.json', '3rd/manifest.yaml') }}

  green:
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: restore guest artifact cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .work
            tools/ramfs/bin/busybox
          key: eshine-work-${{ runner.os }}-${{ hashFiles('tools/artifacts.json', '3rd/manifest.yaml') }}
          restore-keys: eshine-work-${{ runner.os }}-
      - name: build toolchain image
        run: docker build -t eshine-build:ci -f docker/Dockerfile.build .
      - name: prepare + green suite (shard ${{ matrix.shard }}/3)
        env:
          CI_SKIP_FETCH: 1
          CI_SHARD: ${{ matrix.shard }}/3
        run: |
          mkdir -p "$RUNNER_TEMP/workdir/home" "$RUNNER_TEMP/workdir/tmp"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" -v "$RUNNER_TEMP/workdir:/workdir" \
            -e ESHINE_WORK="$PWD/.work" -e HOME=/workdir/home \
            -e TMPDIR=/workdir/tmp \
            -e CI_SKIP_FETCH -e CI_SHARD \
            -w "$PWD" eshine-build:ci \
            bash scripts/ci-gates.sh all
      - name: upload gate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-shard-${{ matrix.shard }}
          path: |
            .work/logs
            .work/logs/gates-summary.json
          if-no-files-found: warn

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: build toolchain image
        run: docker build -t eshine-build:ci -f docker/Dockerfile.build .
      - name: prepare work root
        run: mkdir -p "$RUNNER_TEMP/work/home" "$RUNNER_TEMP/work/tmp"
      - name: container smoke
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$RUNNER_TEMP/work:/work" \
            -e ESHINE_WORK=/work -e HOME=/work/home -e TMPDIR=/work/tmp \
            -w /src eshine-build:ci \
            bash scripts/ci-smoke.sh