name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler python3
      - name: build
        run: make -j"$(nproc)"
      - name: static checks
        run: |
          bash -n scripts/*.sh tools/*.sh
          python3 -m py_compile tools/verify/*.py tools/*.py
