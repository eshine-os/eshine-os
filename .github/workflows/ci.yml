name: ci
on: [push, pull_request]
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm
      - name: build
        run: make
      - name: true-green verify
        run: python3 tools/verify/verify_el2.py
