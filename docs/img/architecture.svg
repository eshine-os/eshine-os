<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <!-- Copyright (c) 2026 Julian Chu -->
  <!-- eshine-os system architecture (Type-1 hypervisor; ISO 26262 functional safety x ISO/SAE 21434 cybersecurity) -->
  <!-- Editable source of docs/img/architecture.png (Gitee does not render SVG in
       markdown). After editing, re-render: rsvg-convert -w 1560 -o docs/img/architecture.png docs/img/architecture.svg -->

  <rect x="0" y="0" width="780" height="560" rx="10" fill="#ffffff" stroke="#d8d2c2" stroke-width="1.5"/>

  <!-- title -->
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#33290A">eshine-os — System Architecture</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#6b6350">ARM64 Type-1 hypervisor · functional safety (ISO 26262) × cybersecurity (ISO/SAE 21434)</text>

  <!-- ================= VM row ================= -->
  <!-- VM0 -->
  <g>
    <rect x="20" y="74" width="236" height="210" rx="8" fill="#fff" stroke="#b30000" stroke-width="2.5"/>
    <rect x="20" y="74" width="236" height="34" rx="8" fill="#b30000"/>
    <rect x="20" y="94" width="236" height="14" fill="#b30000"/>
    <text x="32" y="96" font-size="12" font-weight="bold" fill="#ffffff">VM0 · Management Domain</text>
    <text x="32" y="128" font-size="11.5" font-weight="bold" fill="#33290A">Self-developed RTOS (from scratch)</text>
    <text x="32" y="150" font-size="11" fill="#4a4436">• 32-prio deterministic scheduler</text>
    <text x="32" y="170" font-size="11" fill="#4a4436">• Send/Recv/Reply IPC + services</text>
    <text x="32" y="190" font-size="11" fill="#4a4436">• Fault containment &amp; health mon.</text>
    <text x="32" y="210" font-size="11" fill="#4a4436">• Safety &amp; security management</text>
    <text x="32" y="236" font-size="10.5" font-style="italic" fill="#8c8368">The trusted domain that never goes dark</text>
    <rect x="140" y="60" width="56" height="22" rx="4" fill="#1d4ed8"/>
    <text x="168" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">CAL-3</text>
    <rect x="200" y="60" width="56" height="22" rx="4" fill="#7a0000"/>
    <text x="228" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">ASIL-D</text>
  </g>

  <!-- VM1 -->
  <g>
    <rect x="272" y="74" width="236" height="210" rx="8" fill="#fff" stroke="#9aa08c" stroke-width="2.5" stroke-dasharray="7 4"/>
    <rect x="272" y="74" width="236" height="34" rx="8" fill="#9aa08c"/>
    <rect x="272" y="94" width="236" height="14" fill="#9aa08c"/>
    <text x="284" y="96" font-size="12" font-weight="bold" fill="#ffffff">VM1 · Reserved Domain</text>
    <text x="284" y="128" font-size="11.5" font-weight="bold" fill="#33290A">Planned: Android cockpit / IVI</text>
    <text x="284" y="150" font-size="11" fill="#4a4436">• Center console &amp; cluster displays</text>
    <text x="284" y="170" font-size="11" fill="#4a4436">• QM mixed-criticality guest</text>
    <text x="284" y="190" font-size="11" fill="#4a4436">• Isolated from safety domains</text>
    <text x="284" y="236" font-size="10.5" font-style="italic" fill="#8c8368">Slot reserved; boot target in design</text>
    <rect x="422" y="60" width="44" height="22" rx="4" fill="#1d4ed8"/>
    <text x="444" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">CAL-2</text>
    <rect x="468" y="60" width="40" height="22" rx="4" fill="#6f7462"/>
    <text x="488" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">QM</text>
  </g>

  <!-- VM2 -->
  <g>
    <rect x="524" y="74" width="236" height="210" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="524" y="74" width="236" height="34" rx="8" fill="#d97706"/>
    <rect x="524" y="94" width="236" height="14" fill="#d97706"/>
    <text x="536" y="96" font-size="12" font-weight="bold" fill="#ffffff">VM2 · Linux Guest</text>
    <text x="536" y="128" font-size="11.5" font-weight="bold" fill="#33290A">Linux 6.6 upstream kernel</text>
    <text x="536" y="150" font-size="11" fill="#4a4436">• Intelligent-driving applications</text>
    <text x="536" y="170" font-size="11" fill="#4a4436">• Service domain + musl userland</text>
    <text x="536" y="190" font-size="11" fill="#4a4436">• Real Linux, stage-2 isolated</text>
    <text x="536" y="236" font-size="10.5" font-style="italic" fill="#8c8368">Rich OS for perception &amp; planning</text>
    <rect x="640" y="60" width="54" height="22" rx="4" fill="#1d4ed8"/>
    <text x="667" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">CAL-2</text>
    <rect x="698" y="60" width="62" height="22" rx="4" fill="#a35a05"/>
    <text x="729" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">ASIL-A/B</text>
  </g>

  <!-- isolation connectors (left/right only; label centered between) -->
  <line x1="138" y1="284" x2="138" y2="316" stroke="#8c8368" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="642" y1="284" x2="642" y2="316" stroke="#8c8368" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="305" text-anchor="middle" font-size="10.5" fill="#6b6350">per-VM stage-2 address space · fail-closed cross-VM windows</text>

  <!-- ================= hypervisor band ================= -->
  <g>
    <rect x="20" y="316" width="740" height="88" rx="8" fill="#2b2b2b"/>
    <text x="32" y="342" font-size="14" font-weight="bold" fill="#ffffff">Type-1 Hypervisor — direct hardware control at EL2 (no host OS)</text>
    <rect x="584" y="326" width="78" height="22" rx="4" fill="#1d4ed8"/>
    <text x="623" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">CAL-4</text>
    <rect x="668" y="326" width="80" height="22" rx="4" fill="#b30000"/>
    <text x="708" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ASIL-D</text>
    <text x="32" y="364" font-size="11" fill="#e5e0d0">per-VM stage-2 isolation · vGIC / vtimer / virtio device models · CPU &amp; memory quotas</text>
    <text x="32" y="384" font-size="11" fill="#e5e0d0">fail-closed shared-memory windows · PSCI VM lifecycle (default-deny) · fault containment</text>
  </g>

  <!-- control arrows to hardware -->
  <line x1="138" y1="404" x2="138" y2="424" stroke="#8c8368" stroke-width="1.5"/>
  <line x1="390" y1="404" x2="390" y2="424" stroke="#8c8368" stroke-width="1.5"/>
  <line x1="642" y1="404" x2="642" y2="424" stroke="#8c8368" stroke-width="1.5"/>

  <!-- ================= hardware band ================= -->
  <rect x="20" y="424" width="740" height="52" rx="8" fill="#F0EDE3" stroke="#d8d2c2" stroke-width="1.5"/>
  <text x="390" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33290A">Hardware / SoC</text>
  <text x="390" y="464" text-anchor="middle" font-size="11" fill="#6b6350">today: QEMU virt (ARM64 Cortex-A57) · roadmap: automotive SoC + SMMU</text>

  <!-- ================= legend: two dimensions ================= -->
  <text x="20" y="500" font-size="11" font-style="italic" fill="#8c8368">Functional safety (ISO 26262):</text>
  <rect x="212" y="488" width="14" height="14" fill="#b30000"/>
  <text x="232" y="500" font-size="11" fill="#4a4436">ASIL-D — hypervisor · VM0</text>
  <rect x="398" y="488" width="14" height="14" fill="#d97706"/>
  <text x="418" y="500" font-size="11" fill="#4a4436">ASIL-A/B — VM2</text>
  <rect x="520" y="488" width="14" height="14" fill="#9aa08c"/>
  <text x="540" y="500" font-size="11" fill="#4a4436">QM — VM1</text>

  <text x="20" y="518" font-size="11" font-style="italic" fill="#8c8368">Cybersecurity (ISO/SAE 21434):</text>
  <rect x="222" y="506" width="14" height="14" fill="#1d4ed8"/>
  <text x="242" y="518" font-size="11" fill="#4a4436">CAL-4 — hypervisor (root of trust)</text>
  <rect x="450" y="506" width="14" height="14" fill="#1d4ed8"/>
  <text x="470" y="518" font-size="11" fill="#4a4436">CAL-3 — VM0</text>
  <rect x="560" y="506" width="14" height="14" fill="#1d4ed8"/>
  <text x="580" y="518" font-size="11" fill="#4a4436">CAL-2 — VM1/VM2</text>

  <text x="20" y="540" font-size="10.5" font-style="italic" fill="#8c8368">ASIL and CAL levels are architecture design targets; the ISO 26262 and ISO/SAE 21434 certification programs are in progress (see KNOWN-ISSUES.md).</text>
</svg>
