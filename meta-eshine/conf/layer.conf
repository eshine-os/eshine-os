# 站三十四:eshine-os 的 Yocto 层。参考实现与工具链的 60 补丁战争
# 不重演——本层零补丁:构建吃 git archive 提交树(scripts/
# archive-source.sh 机制),交叉工具链走宿主四件(HOSTTOOLS
# 白名单制;gcc-cross 内建=后弧,v0 政策记档 spec §2)。

BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eshine"
BBFILE_PATTERN_eshine = "^${LAYERDIR}/"
BBFILE_PRIORITY_eshine = "6"

LAYERSERIES_COMPAT_eshine = "scarthgap"

# 宿主交叉四件入白名单(bitbake 沙盒 PATH 以 HOSTTOOLS 符号链接
# 制实现;缺列=do_compile "command not found" 面)
HOSTTOOLS += "aarch64-linux-gnu-gcc aarch64-linux-gnu-ld \
              aarch64-linux-gnu-objcopy aarch64-linux-gnu-ar"
